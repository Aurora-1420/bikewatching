<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header class="map-header">
      <div>
        <h1>🚴 Bikewatching</h1>
        <p>An interactive map exploring bike traffic around Boston.</p>
      </div>
      <label class="time-filter" for="time-slider">
        <span>Filter by time:</span>
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
        <span class="time-display">
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </span>
      </label>
    </header>
    <div id="map" aria-label="Map of the Boston and Cambridge area">
      <svg aria-hidden="true"></svg>
    </div>
    <div class="legend" aria-label="Traffic flow legend">
      <span>Traffic flow:</span>
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
